<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title></title>
		<link rel="stylesheet" href="/w3.css">
		<link rel="stylesheet" href="/common.css">
		<script src="/jq.js"></script>
		<script src="https://kit.fontawesome.com/db65e38582.js" crossorigin="a"></script>
		<style type="text/css">
		th, td {
			border: 1px solid black;
			padding: 4px;
		}
		.filter {
			margin-bottom: 8px;
		}
		.filter label {
			margin-right: 12px;
		}
		</style>
	</head>

	<body class="w3-light-gray">
		<th:block th:replace="fragment/common :: header" />

		<main class="w3-clear">
			<th:block th:replace="fragment/common :: lnb" />

			<section class="w3-left w3-padding">
				<h3 id="view-title" class="w3-teal w3-card"></h3>
				<div class="filter w3-card w3-padding w3-white">
					<label>재생일 <input type="date" id="from" onkeypress="onFilterEnter(event)"> ~ <input type="date" id="to" onkeypress="onFilterEnter(event)"></label>
					<label>스테이지
						<select id="stage">
							<option value="">전체</option>
						</select>
					</label>
					<label><input type="radio" name="mode" value="list" checked> 목록</label>
					<label><input type="radio" name="mode" value="count"> 그룹별 재생 횟수</label>
					<button id="search" class="w3-btn w3-blue">조회</button>
				</div>
				<table class="w3-card">
					<thead class="w3-aqua">
						<tr>
							<th>곡</th>
							<th>스테이지</th>
							<th id="value-col">재생일</th>
							<th class="count-only" style="display:none">최근 재생일</th>
						</tr>
					</thead>
					<tbody></tbody>
				</table>
			</section>
		</main>

		<th:block th:replace="fragment/common :: footer" />
	</body>

	<script type="text/javascript">
	const viewTitle = 'Song play list'

	function fmtDate(d) {
		if(!d || d.length < 6) return d
		return `20${d.slice(0,2)}-${d.slice(2,4)}-${d.slice(4,6)}`
	}
	function ajax(url, successCb, param, failCb) {
		$.ajax({
			url: url,
			data: param,
			success: successCb,
			error: failCb,
			method: 'GET'
		})
	}
	function loadStage() {
		ajax('/api/song/stage', res => {
			res.forEach(item => {
				$('#stage').append($('<option>').val(item.n).text(item.name))
			})
		})
	}
	function loadList() {
		const p = {}
		const from = $('#from').val()
		const to = $('#to').val()
		const stage = $('#stage').val()
		if(from) p.from = from
		if(to) p.to = to
		if(stage) p.stage = stage
		const mode = $('input[name=mode]:checked').val()
		const url = mode == 'count' ? '/api/song/play/count' : '/api/song/play'
		$('#value-col').text(mode == 'count' ? '재생 횟수' : '재생일')
		$('.count-only').toggle(mode == 'count')
		ajax(url, res => {
			$('tbody').empty()
			res.forEach(item => {
				const tr = $('<tr>')
				const nameCell = $('<td>').text(item.songName)
				nameCell.append($('<i>').addClass('fa fa-copy').css({cursor: 'pointer', 'margin-left': '6px'}).attr('title', '곡명 복사').click(() => copyName(item.songName)))
				tr.append(nameCell)
				tr.append($('<td>').text(item.stage))
				tr.append($('<td>').text(mode == 'count' ? item.cnt : fmtDate(item.playDate)))
				if(mode == 'count') tr.append($('<td>').text(fmtDate(item.lastDate)))
				$('tbody').append(tr)
			})
		}, p)
	}
	function onFilterEnter(e) {
		if(e.key == 'Enter') loadList()
	}
	function toast(msg, red) {
		const wrap = document.createElement('div')
		const span = document.createElement('span')
		$('body').append($(wrap).addClass('float-toast').append($(span).addClass(`w3-card ${red ? 'w3-red' : 'w3-green'} w3-padding`).text(msg)))
		setTimeout(() => $(wrap).remove(), 3000)
	}
	function copyName(name) {
		navigator.clipboard.writeText(name).then(() => toast(`${name} 복사됨`), () => toast('복사 실패', true))
	}
	function initView() {
		document.title = viewTitle
		$('#view-title').text(viewTitle)
		$('#search').click(loadList)
		$('#stage').change(loadList)
		$('input[name=mode]').change(loadList)
		loadStage()
		loadList()
	}

	initView()
	</script>
</html>
