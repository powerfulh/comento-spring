	<script type="text/javascript">
	const viewTitle = 'Learn word'
	const colList = [
		{
			name: 'n',
		},
		{
			name: 'word',
		},
		{
			name: 'type',
		},
		{
			name: 'memo',
		},
	]
	const temp = $('tr.append-temp')

	function get() {
		fetch('/plm/word/learn').then(async res => {
			const j = await res.json()
			$('tbody > tr:not(.new):not(.append-temp)').remove()
			j.forEach(item => {
				colList.forEach(col => {
					const cell = temp.find('td.' + col.name)
					cell.text(item[col.name])
				})
				$('tbody').append(temp.clone().removeClass('append-temp'))
			})
		})
	}
	function initView() {
		document.title = viewTitle
		$('#view-title').text(viewTitle)

		colList.forEach(item => {
			const td = document.createElement('td')
			td.setAttribute('class', item.name)
			temp.append(td)
		})
		get()
	}

	initView()
	</script>
